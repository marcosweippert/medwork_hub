    providers:
      smtp:
        name: SMTP
        body: Send invoices, invites, and notices from the clinic mailbox.
        help: Set server, sender, and password in Settings → Email.
      pix:
        name: PIX
        body: Generate instant invoice charges with the clinic PIX key.
        help: Enter key, name, and city in Settings → PIX.
      whatsapp:
        name: WhatsApp
        body: Share the invoice PIX code from the clinic WhatsApp number.
        help: The number lives with the PIX settings.
      calendar:
        name: Calendar
        body: Room slot grid, bookings, and waitlist.
        help: Always on. Hours come from each room and clinic policy.
      webhooks:
        name: Webhooks
        body: Push booking and invoice events to your own endpoint.
        help: Save a POST URL. The Hub sends event, clinic, occurred_at, and data.
      zapier:
        name: Zapier
        body: Pipe bookings and invoices into spreadsheets and other apps.
        help: Use a Catch Hook URL and a Hub API key if Zapier needs to read the Hub.
      google_calendar:
        name: Google Calendar
        body: Mirror room bookings onto the professional’s calendar.
        help: Mark as active while you connect the professional calendars.
      slack:
        name: Slack
        body: Notify the team about new tickets, bookings, and paid invoices.
        help: Paste an Incoming Webhook URL or route through n8n.
      n8n:
        name: n8n
        body: Trigger automations on new bookings, paid invoices, and tickets.
        help: Save the workflow webhook URL. The n8n API key is optional and only used to test the connection.
      make:
        name: Make
        body: Build scenarios from Hub events without writing code.
        help: Paste a Make custom webhook URL.
      discord:
        name: Discord
        body: Post clinic events to a Discord channel.
        help: Use a Discord webhook URL for the channel.
      telegram:
        name: Telegram
        body: Send booking and ticket alerts to a Telegram chat or group.
        help: Paste a bot webhook or n8n Telegram webhook URL.
      microsoft_teams:
        name: Microsoft Teams
        body: Notify a Teams channel when invoices are paid or tickets open.
        help: Paste an Incoming Webhook connector URL.
      google_sheets:
        name: Google Sheets
        body: Append rows for bookings and payments.
        help: Use a webhook (n8n/Make) that writes to the spreadsheet.
      notion:
        name: Notion
        body: Log tickets and bookings in a Notion database.
        help: Paste the automation webhook that creates Notion pages.
      twilio:
        name: Twilio
        body: SMS reminders for waitlist offers and upcoming bookings.
        help: Save the webhook that talks to Twilio, or route through n8n.
      outlook:
        name: Outlook Calendar
        body: Mirror bookings onto Outlook/Microsoft 365 calendars.
        help: Mark as active while calendar sync is configured.
      custom:
        name: Custom webhook
        body: Any extra endpoint that should receive the same Hub events.
        help: Name it however you like. You can add more than one.
    n8n:
      setup: n8n connection
      setup_help: The usual path is an n8n Webhook node. The n8n public API JWT does not belong in git — keep it in n8n, or paste it here only to test the API.
