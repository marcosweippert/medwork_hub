    providers:
      smtp:
        name: SMTP
        body: Envio de faturas, convites e avisos pela conta de e-mail da clínica.
        help: Configure servidor, remetente e senha em Configurações → E-mail.
      pix:
        name: PIX
        body: Gera cobrança instantânea nas faturas com a chave da clínica.
        help: Informe chave, nome e cidade em Configurações → PIX.
      whatsapp:
        name: WhatsApp
        body: Compartilha o código PIX da fatura pelo WhatsApp da clínica.
        help: O número fica junto das configurações de PIX.
      calendar:
        name: Calendário
        body: Grade de horários, reservas e lista de espera das salas.
        help: Sempre ativo. Horários vêm de cada sala e da política da clínica.
      webhooks:
        name: Webhooks
        body: Recebe eventos de reserva e fatura em um endpoint seu.
        help: Salve uma URL POST. O Hub envia event, clinic, occurred_at e data.
      zapier:
        name: Zapier
        body: Encadeia reservas e faturas com planilhas e outros apps.
        help: Use a URL Catch Hook e, se o Zapier for ler o Hub, uma chave de API.
      google_calendar:
        name: Google Calendar
        body: Espelha reservas da sala na agenda do profissional.
        help: Marque como ativo enquanto as agendas dos profissionais são ligadas.
      slack:
        name: Slack
        body: Avisa a equipe sobre chamados, reservas e faturas pagas.
        help: Cole a URL de Incoming Webhook ou encaminhe pelo n8n.
      n8n:
        name: n8n
        body: Dispara automações quando houver reserva, fatura paga ou chamado novo.
        help: Salve a URL do webhook do fluxo. A chave da API do n8n é opcional e só serve para testar a conexão.
      make:
        name: Make
        body: Monta cenários a partir dos eventos do Hub, sem código.
        help: Cole a URL de webhook customizado do Make.
      discord:
        name: Discord
        body: Publica eventos da clínica em um canal do Discord.
        help: Use a URL de webhook do canal.
      telegram:
        name: Telegram
        body: Envia alertas de reserva e chamado para um chat ou grupo.
        help: Cole o webhook do bot ou o webhook do n8n para o Telegram.
      microsoft_teams:
        name: Microsoft Teams
        body: Avisa um canal do Teams quando a fatura é paga ou o chamado abre.
        help: Cole a URL do conector Incoming Webhook.
      google_sheets:
        name: Google Sheets
        body: Acrescenta linhas de reservas e pagamentos na planilha.
        help: Use um webhook (n8n/Make) que grave na planilha.
      notion:
        name: Notion
        body: Registra chamados e reservas em um banco do Notion.
        help: Cole o webhook da automação que cria páginas no Notion.
      twilio:
        name: Twilio
        body: SMS de lembrete para lista de espera e próximas reservas.
        help: Salve o webhook que fala com a Twilio, ou passe pelo n8n.
      outlook:
        name: Outlook Calendar
        body: Espelha reservas no Outlook / Microsoft 365.
        help: Marque como ativo enquanto a sincronização da agenda é configurada.
      custom:
        name: Webhook personalizado
        body: Qualquer outro endpoint que deva receber os mesmos eventos do Hub.
        help: Dê o nome que quiser. Dá para cadastrar mais de um.
